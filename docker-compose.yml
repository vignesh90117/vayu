version: '3.8'

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    command: node backend/gateway/index.js
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - TELEMETRY_SERVICE_URL=http://telemetry:5001
      - CLUSTERING_SERVICE_URL=http://clustering:5002
      - REPORTS_SERVICE_URL=http://reports:5003
      - AUTHORITY_SERVICE_URL=http://authority:5004
    depends_on:
      - telemetry
      - clustering
      - reports
      - authority

  telemetry:
    build:
      context: .
      dockerfile: Dockerfile
    command: node backend/services/telemetry-service/index.js
    ports:
      - "5001:5001"
    environment:
      - PORT=5001

  clustering:
    build:
      context: .
      dockerfile: Dockerfile
    command: node backend/services/clustering-service/index.js
    ports:
      - "5002:5002"
    environment:
      - PORT=5002

  reports:
    build:
      context: .
      dockerfile: Dockerfile
    command: node backend/services/reports-service/index.js
    ports:
      - "5003:5003"
    environment:
      - PORT=5003

  authority:
    build:
      context: .
      dockerfile: Dockerfile
    command: node backend/services/authority-service/index.js
    ports:
      - "5004:5004"
    environment:
      - PORT=5004
